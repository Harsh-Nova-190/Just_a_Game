<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nova Feast · NovaBytes</title>
<style>
  :root { --bg:#05030d; --gold:#ffcf4a; --cyan:#3be8ff; --pink:#ff3d7f; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); overflow:hidden; color:#fff; font-family:"Segoe UI","Trebuchet MS",sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  .hud { position:fixed; top:14px; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:0 22px; pointer-events:none; font-weight:700; font-size:22px; text-shadow:0 0 14px rgba(255,207,74,.7); }
  .hud small { display:block; font-size:11px; font-weight:400; opacity:.65; letter-spacing:.08em; }
  #combo { color:var(--cyan); text-shadow:0 0 14px var(--cyan); min-width:60px; text-align:center; transition:transform .12s; }
  .panel { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; background:radial-gradient(circle at center, rgba(5,3,13,.55), rgba(5,3,13,.9)); }
  .panel.hide { display:none; }
  h1 { font-size:clamp(46px,12vw,96px); font-weight:900; line-height:.92; letter-spacing:-.02em; background:linear-gradient(180deg,#fff6cf,var(--gold) 55%,#ff8a3d); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 22px rgba(255,170,60,.55)); }
  p { max-width:32ch; line-height:1.45; opacity:.82; }
  .legend { display:flex; gap:22px; font-size:14px; opacity:.95; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:7px; vertical-align:-1px; }
  .legend .a i { background:var(--cyan); box-shadow:0 0 10px var(--cyan); }
  .legend .b i { background:#07040f; border:2px solid var(--pink); box-shadow:0 0 10px var(--pink); }
  button { font:inherit; font-weight:800; font-size:18px; padding:14px 38px; border:0; border-radius:999px; background:var(--gold); color:#2a1500; cursor:pointer; box-shadow:0 0 28px rgba(255,207,74,.6); }
  button:hover { transform:scale(1.04); }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  .best { color:var(--cyan); font-weight:700; min-height:1.2em; }
  @media (prefers-reduced-motion:reduce) { button:hover { transform:none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Nova Feast game"></canvas>
<div class="hud">
  <div><small>SCORE</small><span id="score">0</span></div>
  <div id="combo"></div>
  <div style="text-align:right"><small>BEST</small><span id="best">0</span></div>
</div>

<div class="panel" id="menu">
  <h1>NOVA<br>FEAST</h1>
  <p>You're a hungry little star. Swallow what's smaller, grow, and escape what's bigger.</p>
  <div class="legend"><span class="a"><i></i>Eat it</span><span class="b"><i></i>Run</span></div>
  <p>Move your mouse or finger, and your star follows.</p>
  <button id="go">Start feasting</button>
  <div class="best" id="menuBest"></div>
</div>
<div class="panel hide" id="over">
  <h1>SWALLOWED</h1>
  <p id="final"></p>
  <button id="again">Feast again</button>
</div>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
let W, H, D;
function resize(){ D = Math.min(devicePixelRatio || 1, 2); W = cv.width = Math.floor(innerWidth * D); H = cv.height = Math.floor(innerHeight * D); }
addEventListener('resize', resize); resize();

let best = 0; try { best = +localStorage.getItem('nf_best') || 0; } catch (e) {}
$('best').textContent = best; $('menuBest').textContent = best ? 'Best: ' + best : '';

// ---------- state ----------
let state = 'menu', P, cam, zoom, ents, parts, score, combo, comboT, shake, pulse, mx, my, clock = 0;
const TARGET = 55;
const stars = [0.15, 0.35, 0.6].map(f => ({ f, pts: Array.from({ length: 60 }, () => [Math.random(), Math.random(), rnd(.6, 1.8)]) }));

const baseZoom = r => Math.min(W, H) * 0.022 / Math.pow(r, 0.85);
const viewR = () => Math.hypot(W, H) / 2 / zoom;

function reset(){
  P = { x: 0, y: 0, r: 14 }; cam = { x: 0, y: 0 }; zoom = baseZoom(14);
  ents = []; parts = []; score = 0; combo = 0; comboT = 0; shake = 0; pulse = 0; mx = W / 2; my = H / 2;
  for (let i = 0; i < TARGET; i++) spawn(true);
  hud();
}

function spawn(init){
  const vr = viewR(), a = rnd(0, 6.283), d = init ? rnd(P.r * 4, vr * 1.4) : rnd(vr * 1.05, vr * 1.5);
  const u = Math.random(); let r;
  if (u < .64) r = P.r * rnd(.2, .9);
  else if (u < .74) r = P.r * rnd(.92, 1.08);
  else r = P.r * rnd(1.2, 2.8);
  r = Math.max(r, 3);
  const s = P.r * rnd(.3, 1.1), b = rnd(0, 6.283);
  ents.push({ x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, r, vx: Math.cos(b) * s, vy: Math.sin(b) * s, hunter: r > P.r * 1.1 && Math.random() < .4 });
}

function burst(x, y, n, hue, spd, life){
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283), s = rnd(.3, 1) * spd / zoom;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, s: rnd(1.5, 4) * D, h: hue, a: 1 });
  }
}

function hud(){
  $('score').textContent = score;
  $('combo').textContent = combo > 1 ? 'x' + combo : '';
}

// ---------- update ----------
function update(dt, live){
  const m = Math.min(W, H);
  if (live){
    const dx = mx - W / 2, dy = my - H / 2, dist = Math.hypot(dx, dy);
    const k = Math.min(dist / (m * .22), 1), sp = m * .5 * k / zoom;
    if (dist > 1){ P.x += dx / dist * sp * dt; P.y += dy / dist * sp * dt; }
    if (k > .25) parts.push({ x: P.x, y: P.y, vx: 0, vy: 0, life: .45, max: .45, s: P.r * zoom * .55, h: 42, a: .3 });
    if (comboT > 0){ comboT -= dt; if (comboT <= 0 && combo){ combo = 0; hud(); } }
  }
  cam.x += (P.x - cam.x) * Math.min(dt * 9, 1);
  cam.y += (P.y - cam.y) * Math.min(dt * 9, 1);
  zoom += (baseZoom(P.r) - zoom) * Math.min(dt * 3, 1);
  pulse = Math.max(0, pulse - dt * 4);
  shake = Math.max(0, shake - dt);

  const vr = viewR(), hs = m * .5 * .55 / zoom;
  for (let i = ents.length - 1; i >= 0; i--){
    const e = ents[i], dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    if (live && e.hunter && e.r > P.r * 1.1 && d < vr * 1.1){
      e.vx += (dx / d * hs - e.vx) * dt * 1.5; e.vy += (dy / d * hs - e.vy) * dt * 1.5;
    }
    e.x += e.vx * dt; e.y += e.vy * dt;
    if (d > vr * 2.3 || e.r < P.r * .08){ ents.splice(i, 1); continue; }
    if (!live) continue;
    if (P.r > e.r * 1.1 && d < P.r - e.r * .2){            // eat
      P.r = Math.sqrt(P.r * P.r + e.r * e.r * .85);
      combo = Math.min(combo + 1, 9); comboT = 1.6;
      score += Math.round(10 + 90 * e.r / P.r) * combo;
      pulse = 1; burst(e.x, e.y, Math.min(16, 5 + e.r / 3 | 0), 190, 220, .6);
      ents.splice(i, 1); hud();
    } else if (e.r > P.r * 1.1 && d < e.r - P.r * .2){      // eaten
      die(); return;
    }
  }
  while (ents.length < TARGET) spawn(false);

  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function die(){
  state = 'over'; shake = .45;
  burst(P.x, P.y, 70, 42, 420, 1.1);
  if (score > best){ best = score; try { localStorage.setItem('nf_best', best); } catch (e) {} }
  $('best').textContent = best;
  $('final').textContent = 'Score ' + score + (score > 0 && score >= best ? ' · new best!' : ' · best ' + best);
  setTimeout(() => { $('over').classList.remove('hide'); $('again').focus(); }, 900);
}

// ---------- draw ----------
const sx = x => (x - cam.x) * zoom + W / 2, sy = y => (y - cam.y) * zoom + H / 2;

function orb(x, y, r, kind, t){
  const hue = [190, 265, 335, 42][kind];
  let gr = g.createRadialGradient(x, y, r * .6, x, y, r * 2.4);
  gr.addColorStop(0, `hsla(${hue},100%,60%,${kind === 2 ? .45 : .32})`);
  gr.addColorStop(1, `hsla(${hue},100%,60%,0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 2.4, 0, 7); g.fill();
  if (kind === 2){
    g.fillStyle = '#07040f'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.strokeStyle = `hsl(${hue},100%,62%)`; g.lineWidth = Math.max(2 * D, r * .08); g.stroke();
    g.globalAlpha = .5; g.beginPath(); g.arc(x, y, r * (.55 + .08 * Math.sin(t * 4)), 0, 7); g.stroke(); g.globalAlpha = 1;
  } else {
    gr = g.createRadialGradient(x - r * .3, y - r * .35, r * .05, x, y, r);
    gr.addColorStop(0, `hsl(${hue},100%,${kind === 3 ? 96 : 82}%)`);
    gr.addColorStop(1, `hsl(${hue},95%,${kind === 3 ? 56 : 48}%)`);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
}

function draw(){
  g.save();
  if (shake > 0) g.translate((Math.random() - .5) * shake * 50 * D, (Math.random() - .5) * shake * 50 * D);
  g.fillStyle = '#05030d'; g.fillRect(-60, -60, W + 120, H + 120);
  let bg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) / 2);
  bg.addColorStop(0, '#150b30'); bg.addColorStop(1, '#05030d'); g.fillStyle = bg; g.fillRect(0, 0, W, H);

  for (const L of stars){
    g.fillStyle = `rgba(255,255,255,${.25 + L.f})`;
    for (const [px, py, s] of L.pts){
      const x = ((px * W - cam.x * zoom * L.f) % W + W) % W, y = ((py * H - cam.y * zoom * L.f) % H + H) % H;
      g.fillRect(x, y, s * D, s * D);
    }
  }

  const sorted = ents.slice().sort((a, b) => a.r - b.r);
  let nearest = 9;
  for (const e of sorted){
    const x = sx(e.x), y = sy(e.y), r = e.r * zoom;
    if (x + r * 2.4 < 0 || x - r * 2.4 > W || y + r * 2.4 < 0 || y - r * 2.4 > H) continue;
    const kind = P.r > e.r * 1.1 ? 0 : e.r > P.r * 1.1 ? 2 : 1;
    if (kind === 2) nearest = Math.min(nearest, (Math.hypot(e.x - P.x, e.y - P.y) - e.r) / (P.r * 4));
    orb(x, y, r, kind, clock);
  }

  for (const p of parts){
    g.globalAlpha = Math.max(0, p.life / p.max) * p.a;
    g.fillStyle = `hsl(${p.h},100%,65%)`;
    const s = p.s * (p.a < 1 ? p.life / p.max : 1);
    g.beginPath(); g.arc(sx(p.x), sy(p.y), s, 0, 7); g.fill();
  }
  g.globalAlpha = 1;

  if (state !== 'over') orb(W / 2 + (sx(P.x) - W / 2), sy(P.y), P.r * zoom * (1 + .12 * pulse), 3, clock);

  if (state === 'play' && nearest < 1){
    const a = Math.min(1 - Math.max(nearest, 0), 1) * .4;
    const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.hypot(W, H) / 2);
    v.addColorStop(0, 'rgba(255,40,100,0)'); v.addColorStop(1, `rgba(255,40,100,${a})`);
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  }
  g.restore();
}

// ---------- loop & input ----------
let last = 0;
function loop(ts){
  const dt = Math.min((ts - last) / 1000 || 0, .05); last = ts; clock += dt;
  update(dt, state === 'play');
  draw();
  requestAnimationFrame(loop);
}
function start(){ reset(); state = 'play'; $('menu').classList.add('hide'); $('over').classList.add('hide'); }
$('go').onclick = start; $('again').onclick = start;
function point(e){ mx = e.clientX * D; my = e.clientY * D; }
addEventListener('pointermove', point);
addEventListener('pointerdown', point);

reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
